<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Favicon Azul Caffè & Brunch's : le yaz (ⵣ), symbole amazigh de l'homme
       libre, en doré sur badge bleu profond.
       Dégradés en userSpaceOnUse pour s'afficher aussi sur les traits droits. -->
  <defs>
    <linearGradient id="b" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="64">
      <stop offset="0" stop-color="#123A52"/>
      <stop offset="1" stop-color="#0A2230"/>
    </linearGradient>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="16" y1="12" x2="48" y2="55">
      <stop offset="0" stop-color="#E8C888"/>
      <stop offset="0.55" stop-color="#D9B26A"/>
      <stop offset="1" stop-color="#B8934A"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#b)"/>
  <rect x="4" y="4" width="56" height="56" rx="12" fill="none" stroke="#D9B26A" stroke-opacity="0.32" stroke-width="1.4"/>
  <circle cx="32" cy="14" r="3.6" fill="url(#g)"/>
  <g fill="none" stroke="url(#g)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 19.5 L32 48"/>
    <path d="M19.5 27.5 L44.5 27.5"/>
    <path d="M25.5 54.5 L32 48 L38.5 54.5"/>
